# ───────────────────────────────────────────────────────────────────────────
# TDSOCH — The Damn System Of Client Hunting.  Business settings.
# Fill the [BRACKETS] with your real values. You can also edit everything from
# the Settings page in the web app (python tdsoch.py serve → Settings).
# Note: saving from the Settings page rewrites this file without comments; the
# documented copy lives in git history and in README.md.
# ───────────────────────────────────────────────────────────────────────────

business_name: "[YOUR BUSINESS NAME]"
my_name:       "[YOUR NAME]"
my_email:      "[YOUR EMAIL]"          # used in the crawler User-Agent
my_phone:      "[YOUR AU VIRTUAL / VoIP NUMBER]"
payment_link:  "[PAYONEER / WISE REQUEST LINK]"

country: AU

cities:
  - Brisbane
  # - Gold Coast
  # - Perth
  # - Adelaide

niches:
  - dentist
  # - physiotherapist
  # - accountant
  # - plumber
  # - electrician

offer:
  name: "Website Speed & Google Fix"
  price_aud: 249
  delivery_hours: 48
  upsell_monthly_aud: 149

daily_new_leads_target: 60     # how many to find + audit per night
daily_claude_leads_cap: 25     # max leads written per day

dashboard:
  aud_to_pkr: 185              # manual A$→₨ rate for the revenue tile

qualify:
  gates:
    require_reachable: true
    require_not_chain: true
    require_fixable_problem: true
    require_ability_to_pay: true
  min_pages_for_pay_signal: 5
  # A lead needs at least one of these to be a sellable opportunity:
  fixable_problems:
    - low_psi            # PageSpeed mobile < psi_fail_threshold
    - slow_lcp           # LCP > lcp_fail_seconds
    - no_https
    - no_viewport
    - stale_copyright    # footer year <= current year - copyright_stale_years
    - outdated_wp        # ONLY genuinely old WP core (major version < 6)
    - dated_design       # table layouts / old markup — a real "looks dated" problem
    - unstyled           # page has almost no styling
  psi_fail_threshold: 50
  lcp_fail_seconds: 4.0
  copyright_stale_years: 2

# Niche → ability-to-pay tier (higher = more budget / lifetime value).
niche_tiers:
  dentist: 3
  physiotherapist: 3
  accountant: 3
  electrician: 2
  plumber: 2

crawl:
  requests_per_second_per_domain: 1
  timeout_seconds: 15
  obey_robots_txt: true
  max_pages_per_site: 3
  # PageSpeed is OFF by default (slow; throttled without a free PSI_KEY).
  pagespeed: false
